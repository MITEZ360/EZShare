name: Build Android APK

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Prepare Android SDK
        run: |
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$PATH"
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT:-unset}" >> "$GITHUB_STEP_SUMMARY"
          ls -d "$ANDROID_HOME" "$ANDROID_HOME"/* 2>&1 | head -40 >> "$GITHUB_STEP_SUMMARY" || true
          echo "platforms:" >> "$GITHUB_STEP_SUMMARY"
          ls "$ANDROID_HOME/platforms" 2>&1 | sort >> "$GITHUB_STEP_SUMMARY" || true
          echo "build-tools:" >> "$GITHUB_STEP_SUMMARY"
          ls "$ANDROID_HOME/build-tools" 2>&1 | sort >> "$GITHUB_STEP_SUMMARY" || true
          ls "$ANDROID_HOME/platforms" | sort | while IFS= read -r line; do printf '::notice::PLATFORM %s\n' "$line"; done
          test -d "$ANDROID_HOME/platforms/android-37" || printf '::error::android-37 missing\n'
          test -d "$ANDROID_HOME/build-tools/37.0.0" || printf '::error::build-tools 37.0.0 missing\n'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('android/**/*.gradle.kts', 'android/gradle.properties') }}
          restore-keys: gradle-

      - name: Install Gradle 8.13
        run: |
          curl -fsSL -o /tmp/gradle.zip https://services.gradle.org/distributions/gradle-8.13-bin.zip
          unzip -q /tmp/gradle.zip -d /tmp
          echo "/tmp/gradle-8.13/bin" >> "$GITHUB_PATH"

      - name: Build debug APK
        working-directory: android
        run: |
          gradle assembleDebug --no-daemon --stacktrace > /tmp/ez-build.log 2>&1 || true
          tail -150 /tmp/ez-build.log >> "$GITHUB_STEP_SUMMARY"
          grep -n -E "error:|^e: |FAILURE:|What went wrong|Execution failed|Could not|not found" /tmp/ez-build.log | head -60 | while IFS= read -r line; do printf '::error::%s\n' "${line//'%'/%25}"; done
          grep -q "BUILD SUCCESSFUL" /tmp/ez-build.log

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: EZShare-Android
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
