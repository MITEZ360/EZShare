name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Prepare Android SDK
        run: |
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$PATH"
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('android/**/*.gradle.kts', 'android/gradle.properties') }}
          restore-keys: gradle-

      - name: Install Gradle 8.9
        run: |
          curl -fsSL -o /tmp/gradle.zip https://services.gradle.org/distributions/gradle-8.9-bin.zip
          unzip -q /tmp/gradle.zip -d /tmp
          echo "/tmp/gradle-8.9/bin" >> "$GITHUB_PATH"

      - name: Build debug APK
        working-directory: android
        run: |
          gradle assembleDebug --no-daemon --stacktrace > /tmp/ez-build.log 2>&1 || true
          tail -150 /tmp/ez-build.log >> "$GITHUB_STEP_SUMMARY"
          grep -n -E "error:|^e: |FAILURE:|What went wrong|Execution failed|Could not|not found" /tmp/ez-build.log | head -60 | while IFS= read -r line; do printf '::error::%s\n' "${line//'%'/%25}"; done
          grep -q "BUILD SUCCESSFUL" /tmp/ez-build.log

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: EZShare-Android
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

  macos:
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build universal app
        run: ./scripts/build.sh universal

      - name: Package app
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          cd build
          ditto -c -k --sequesterRsrc --keepParent EZShare.app "../EZShare-${VERSION}-macOS-universal.zip"

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: EZShare-macOS
          path: EZShare-*-macOS-universal.zip
          if-no-files-found: error
          retention-days: 30

  publish:
    needs: [android, macos]
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          ANDROID_APK="artifacts/EZShare-Android/app-debug.apk"
          MAC_ZIP=$(find artifacts/EZShare-macOS -name 'EZShare-*-macOS-universal.zip' -print -quit)
          test -s "$ANDROID_APK"
          test -s "$MAC_ZIP"
          cp "$ANDROID_APK" "EZShare-${VERSION}-android.apk"
          cat > /tmp/ez-release-notes.md <<EOF
EZShare $VERSION — macOS 与 Android 双端发布。

功能：局域网文件/文本共享、访问码、上传与删除开关、Bonjour/mDNS 设备发现。Android 支持加入已运行的共享或启动本机服务。

macOS：下载 EZShare-${VERSION}-macOS-universal.zip，解压后把 EZShare.app 拖入「应用程序」。Intel 与 Apple Silicon 通用。首次打开若被拦截，右键 → 打开。

Android：下载 EZShare-${VERSION}-android.apk 安装，需允许安装未知来源应用。首次启动授权共享目录；常驻通知用于保持后台共享。

访问码可在 App 设置中查看或关闭。
EOF
          gh release create "$GITHUB_REF_NAME" \
            --title "EZShare $VERSION" \
            --notes-file /tmp/ez-release-notes.md \
            "EZShare-${VERSION}-android.apk" \
            "$MAC_ZIP"
